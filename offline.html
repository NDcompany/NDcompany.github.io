<html lang="en">
<head>

<style>
  :root {
    --bg: #ffffff; --text: #111111; --muted: #45454f; --soft: #62626d;
    --line: rgba(17, 17, 17, 0.12); --chip: #f4f4f6; --focus: #8257e5;
    --pill: rgba(229, 229, 229, 0.75); --pill-border: rgba(255, 255, 255, 0.6);
    --pill-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.1), 0 10px 20px -5px rgba(0, 0, 0, 0.05), inset 0 0 20px rgba(255, 255, 255, 0.5);
    --btn: #000000; --glow: rgba(130, 87, 229, 0.12);
    --display: 'Syne', 'Segoe UI', system-ui, sans-serif;
    --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  .dark {
    --bg: #0a0a0f; --text: #ffffff; --muted: rgba(255, 255, 255, 0.8); --soft: rgba(255, 255, 255, 0.68);
    --line: rgba(130, 87, 229, 0.3); --chip: #16162a; --focus: #a78bfa;
    --pill: rgba(20, 20, 35, 0.85); --pill-border: rgba(100, 100, 200, 0.4);
    --pill-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.5), 0 10px 20px -5px rgba(130, 87, 229, 0.2), inset 0 0 20px rgba(130, 87, 229, 0.1);
    --btn: #ffffff; --btn-text: #0a0a0f; --glow: rgba(130, 87, 229, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--text);
    font-family: var(--body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .page {
    max-width: 1200px; min-height: 100vh; min-height: 100dvh; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(clamp(16px, 5vw, 48px), env(safe-area-inset-right)) 40px max(clamp(16px, 5vw, 48px), env(safe-area-inset-left));
    display: flex; flex-direction: column;
  }
  .top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .brand {
    display: inline-flex; align-items: center; gap: 12px; padding: 8px 24px 8px 8px;
    background: var(--pill); border: 1px solid var(--pill-border); box-shadow: var(--pill-shadow);
    -webkit-backdrop-filter: blur(25px) saturate(200%); backdrop-filter: blur(25px) saturate(200%);
    border-radius: 50px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 1.05rem;
  }
  .brand-mark { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #000; flex: none; }
  .dark .brand-mark { background: #333446; } /* Header.jsx gives the dark logo this backdrop */
  .brand-mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .logo-light { background: #ffffff; }
  .brand-mark .logo-dark, .dark .brand-mark .logo-light { display: none; }
  .dark .brand-mark .logo-dark { display: block; }
  .status {
    margin: 0; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
    border: 1px solid var(--line); border-radius: 50px; background: var(--chip);
    font-size: 0.85rem; font-weight: 600; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15); }
  .online .dot { background: #16a34a; box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.18); }
  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    align-items: center; align-content: center; gap: clamp(32px, 6vw, 80px); padding: clamp(32px, 7vh, 88px) 0 clamp(16px, 4vh, 40px);
  }
  .eyebrow { margin: 0 0 14px; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  h1 { margin: 0 0 18px; font-family: var(--display); font-weight: 700; font-size: clamp(2.5rem, 6vw, 4.2rem); line-height: 1.05; letter-spacing: -0.02em; }
  .lead { margin: 0 0 30px; max-width: 52ch; font-size: 1.12rem; line-height: 1.65; color: var(--muted); }
  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 28px; }
  .btn {
    padding: 14px 32px; border: 0; border-radius: 30px; background: var(--btn); color: var(--btn-text, #ffffff);
    font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: transform 0.3s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.05); }
  .btn:active { transform: none; scale: 0.97; }
  .text-link { color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(17, 17, 17, 0.35); }
  .dark .text-link { text-decoration-color: rgba(255, 255, 255, 0.45); }
  .text-link:hover { text-decoration-color: currentColor; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .saved { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
  .saved h2 { margin: 0 0 14px; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  .saved ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  .saved li { max-width: 100%; }
  .saved a {
    display: block; max-width: 100%; padding: 9px 16px; border: 1px solid var(--line); border-radius: 50px;
    color: inherit; text-decoration: none; font-size: 0.9rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: border-color 0.2s ease;
  }
  .saved a:hover { border-color: currentColor; }
  .art { position: relative; width: 100%; max-width: 540px; justify-self: center; }
  .art::before {
    content: ''; position: absolute; inset: -12% 0; z-index: -1;
    background: radial-gradient(closest-side, var(--glow), transparent);
  }
  .art svg { display: block; width: 100%; height: auto; }
  /* Same recolouring as the service page illustrations (src/css/services.css). */
  .dark .art [fill="#333446"] { fill: #a78bfa; }
  .dark .art [fill="#3f3d56"], .dark .art [fill="#2f2e41"], .dark .art [fill="#090814"] { fill: #dcdcea; }
  .dark .art [fill="#fff"] { fill: #262640; }
  .dark .art [fill="#d6d6e3"], .dark .art [fill="#ccc"] { fill: #4a4a66; }
  @media (max-width: 860px) and (orientation: portrait), (max-width: 600px) {
    main { grid-template-columns: minmax(0, 1fr); text-align: center; gap: 24px; padding-top: 28px; }
    .art { order: -1; max-width: min(100%, 420px, 45vh); } /* height cap keeps the heading and button on short screens */
    .lead { margin-left: auto; margin-right: auto; }
    .actions, .saved ul { justify-content: center; }
  }
  @media (max-width: 480px) {
    .art { max-width: min(100%, 330px, 45vh); }
    .lead { font-size: 1.02rem; }
    .actions { flex-direction: column; gap: 18px; }
    .btn { width: 100%; }
  }
  @media (max-width: 360px) {
    .top { gap: 8px; }
    .brand { gap: 8px; padding: 6px 16px 6px 6px; font-size: 0.95rem; }
    .brand-mark { width: 34px; height: 34px; }
    .status { padding: 7px 12px; font-size: 0.78rem; }
  }
  @media (prefers-reduced-motion: reduce) { .btn, .saved a { transition: none; } }
</style>

<script>
  // Reached through a failed in-app link, so clear the app's one-retry guard for this
  // page (lazyRoute in src/routes/AppRoutes.jsx); the next attempt can retry again.
  try { sessionStorage.removeItem('ndco-chunk-retry:' + location.pathname); } catch (e) {}
  // navigator.onLine is only certain when false: true means the device has a network, not that our
  // site answered (an outage, a 5xx, a stopped server, Wi-Fi that wants a sign-in first). The copy
  // above is the offline one; while the device is online, say what happened instead.
  if (navigator.onLine) {
    document.title = 'Site not responding | N&D Co.';
    [['#status-text', 'Site not responding'], ['.eyebrow', 'Connection problem'], ['h1', "Our site isn't responding"],
      ['.lead', "Your device is connected, but our site didn't answer. Pages you've opened on this device still work, and this page reloads by itself as soon as the site is back."]]
      .forEach(function (s) { document.querySelector(s[0]).textContent = s[1]; });
  }
  window.addEventListener('online', function () {
    document.documentElement.classList.add('online');
    document.getElementById('status-text').textContent = 'Back online, reloading';
    location.reload();
  });
  // Back and Forward into pages the app created with pushState only change the URL
  // here, so load the page for real (the service worker answers from its cache).
  window.addEventListener('popstate', function () { location.reload(); });
  // "Online" but the site is unreachable (captive portal, dead mobile data, an outage)
  // fires no 'online' event, so check quietly and reload once the site answers (a 5xx
  // from the host is still an outage, but Cloudflare's own check, cf-mitigated, is the
  // site answering). Every 3 s: at 10 s the page stayed up that long after a short
  // outage had ended.
  if (location.pathname !== '/offline.html') setInterval(function () {
    if (navigator.onLine) fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(function (r) { if (r.status < 500 || r.headers.has('cf-mitigated')) location.reload(); }, function () {});
  }, 3000);

  var openCache = function (prefix) {
    return caches.keys().then(function (names) {
      var name = names.find(function (n) { return n.indexOf(prefix) === 0; });
      if (!name) throw new Error('no ' + prefix + ' cache');
      return caches.open(name);
    });
  };
  // The site's own fonts, from the copies the service worker already stores, with the
  // same weight ranges as src/css/sections/01-reset-variables.css.
  if ('caches' in window) openCache('ndco-static').then(function (cache) { return cache.keys(); }).then(function (reqs) {
    var css = '';
    reqs.forEach(function (req) {
      var m = req.url.match(/\/assets\/(Syne|Inter)-[^/]+\.woff2$/);
      if (m) css += "@font-face{font-family:'" + m[1] + "';src:url('" + req.url + "') format('woff2');font-weight:" + (m[1] === 'Syne' ? '400 800' : '300 700') + ';font-display:swap}';
    });
    if (css) document.head.appendChild(document.createElement('style')).textContent = css;
  }).catch(function () {});

  // Pages this device can open offline: the homepage, then the most recently viewed (the
  // worker saves a page again each time it is shown, which moves it to the end).
  if ('caches' in window) (async function () {
    var pages = await openCache('ndco-pages');
    var paths = [];
    (await pages.keys()).reverse().forEach(function (req) {
      var path = new URL(req.url).pathname;
      if (path !== location.pathname && paths.indexOf(path) < 0) paths.push(path);
    });
    paths.sort(function (a, b) { return (b === '/') - (a === '/'); });
    var list = document.getElementById('saved-list');
    for (var i = 0; i < paths.length && list.children.length < 6; i++) {
      var doc = new DOMParser().parseFromString(await (await pages.match(paths[i])).text(), 'text/html');
      if (!doc.getElementById('root')) continue; // a saved redirect stub, not a page
      // The breadcrumb's short name tells pages apart; long headings cut off alike on phones.
      var label = doc.querySelector('.breadcrumb-current') || doc.querySelector('h1');
      var link = document.createElement('a');
      link.href = paths[i];
      link.textContent = paths[i] === '/' ? 'Homepage' : (label && label.textContent.trim()) || doc.title.replace(/\s*\|\s*N&D Co\.?\s*$/, '') || paths[i];
      list.appendChild(document.createElement('li')).appendChild(link);
    }
    if (list.children.length) document.querySelector('.saved').hidden = false;
  })().catch(function () {});
</script>

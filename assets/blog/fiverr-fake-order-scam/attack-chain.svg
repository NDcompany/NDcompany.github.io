<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" font-family="Arial, Helvetica, sans-serif"><rect width="640" height="860" rx="18" fill="#f2f2f2"/><g font-size="15" fill="#333446"><rect x="40" y="30" width="560" height="104" rx="14" fill="#fff" stroke="#d6d6e3" stroke-width="2"/><circle cx="82" cy="82" r="22" fill="#333446"/><text x="82" y="88" text-anchor="middle" fill="#fff" font-weight="700" font-size="17">1</text><text x="122" y="70" font-weight="700" font-size="17">A brand-new account messages you</text><text x="122" y="94">"I have just placed an order... review the document below."</text><text x="122" y="116">No order exists. Attached: an .html file or a PDF.</text><rect x="40" y="166" width="560" height="104" rx="14" fill="#fff" stroke="#d6d6e3" stroke-width="2"/><circle cx="82" cy="218" r="22" fill="#333446"/><text x="82" y="224" text-anchor="middle" fill="#fff" font-weight="700" font-size="17">2</text><text x="122" y="206" font-weight="700" font-size="17">The file opens a fake Fiverr page</text><text x="122" y="230">"Congratulations! The buyer has purchased your service."</text><text x="122" y="252">After 7 seconds it sends your browser to the scam server.</text><rect x="40" y="302" width="560" height="104" rx="14" fill="#fff" stroke="#d6d6e3" stroke-width="2"/><circle cx="82" cy="354" r="22" fill="#333446"/><text x="82" y="360" text-anchor="middle" fill="#fff" font-weight="700" font-size="17">3</text><text x="122" y="342" font-weight="700" font-size="17">A look-alike site behind a bot check</text><text x="122" y="366">Raw IP addresses, a Netlify page, then domains that</text><text x="122" y="388">are not fiverr.com, some behind a Cloudflare check.</text><rect x="40" y="438" width="560" height="104" rx="14" fill="#fff" stroke="#d6d6e3" stroke-width="2"/><circle cx="82" cy="490" r="22" fill="#333446"/><text x="82" y="496" text-anchor="middle" fill="#fff" font-weight="700" font-size="17">4</text><text x="122" y="478" font-weight="700" font-size="17">"It needs a human touch"</text><text x="122" y="502">A press-and-hold check, then a box for your Fiverr</text><text x="122" y="524">username, so the next page can show your own details.</text><rect x="40" y="574" width="560" height="104" rx="14" fill="#fff" stroke="#d6d6e3" stroke-width="2"/><circle cx="82" cy="626" r="22" fill="#333446"/><text x="82" y="632" text-anchor="middle" fill="#fff" font-weight="700" font-size="17">5</text><text x="122" y="614" font-weight="700" font-size="17">A fake Resolution Center and support chat</text><text x="122" y="638">"Your order has already been confirmed... verify the</text><text x="122" y="660">receiving method before funds are released."</text><rect x="40" y="710" width="560" height="120" rx="14" fill="#333446"/><circle cx="82" cy="770" r="22" fill="#fff"/><text x="82" y="776" text-anchor="middle" fill="#333446" font-weight="700" font-size="17">6</text><text x="122" y="752" font-weight="700" font-size="17" fill="#fff">The real goal: your bank card</text><text x="122" y="776" fill="#fff">"Add a bank card" or "Receive your payout": card</text><text x="122" y="798" fill="#fff">number, expiry date, CVC and cardholder name.</text><text x="122" y="820" fill="#d6d6e3">Fiverr says it never asks you to verify with a card.</text><g fill="#ccc"><path d="M314 136H326V152H336L320 164L304 152H314Z"/><path d="M314 272H326V288H336L320 300L304 288H314Z"/><path d="M314 408H326V424H336L320 436L304 424H314Z"/><path d="M314 544H326V560H336L320 572L304 560H314Z"/><path d="M314 680H326V696H336L320 708L304 696H314Z"/></g></g></svg>
